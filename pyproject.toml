[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "project-brain"
version = "0.1.0"
description = "Persistent project context, intent orchestration and local-model routing for AI-assisted development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
brain = "project_brain.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

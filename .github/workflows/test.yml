name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: gofmt -d cmd internal
      - run: go mod tidy
      - name: test autotune
        continue-on-error: true
        run: go test ./internal/autotune
      - name: test context
        continue-on-error: true
        run: go test ./internal/context
      - name: test core
        continue-on-error: true
        run: go test ./internal/core
      - name: test developerflow
        continue-on-error: true
        run: go test ./internal/developerflow
      - name: test hardware
        continue-on-error: true
        run: go test ./internal/hardware
      - name: test localworker
        continue-on-error: true
        run: go test ./internal/localworker
      - name: test projectmode
        continue-on-error: true
        run: go test ./internal/projectmode
      - name: test repomap
        continue-on-error: true
        run: go test ./internal/repomap
      - name: test router
        continue-on-error: true
        run: go test ./internal/router
      - name: test semantic
        continue-on-error: true
        run: go test ./internal/semantic
      - name: test store
        continue-on-error: true
        run: go test ./internal/store
      - name: test verification
        continue-on-error: true
        run: go test ./internal/verification
      - name: test gitctx
        continue-on-error: true
        run: go test ./internal/gitctx
      - name: test mcpserver
        continue-on-error: true
        run: go test ./internal/mcpserver
      - name: test economy
        continue-on-error: true
        run: go test ./internal/economy
      - name: test brain-core command
        continue-on-error: true
        run: go test ./cmd/brain-core
      - name: test all Go packages
        run: go test ./...
      - run: go build ./cmd/brain-core

  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: pytest -q
